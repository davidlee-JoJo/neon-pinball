<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05050c" />
    <link rel="icon" href="data:," />
    <title>NEON PINBALL 3D 霓虹彈珠檯</title>
    <script type="module" crossorigin src="./assets/index-DS5fOw3V.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BWOmwE1D.css">
  </head>
  <body>
    <div id="app">
      <canvas id="c3d"></canvas>
      <header id="hud">
        <div class="hud-left">
          <div class="hud-label">SCORE 得分</div>
          <div id="score">0</div>
        </div>
        <div id="hud-right">
          <span><span class="hud-label">BALL</span><b id="ball-num">-</b></span>
          <span><span class="hud-label">倍率</span><b id="multiplier">×1</b></span>
          <span><span class="hud-label">最高分</span><b id="highscore">0</b></span>
          <button id="btn-pause">PAUSE</button>
          <button id="btn-mute">音效 ON</button>
        </div>
      </header>
      <footer id="deck">
        <button class="pk-btn nudge" id="btn-nudge-l" aria-label="推桌左">
          <svg viewBox="0 0 48 28" aria-hidden="true">
            <path d="M22 6 L11 14 L22 22" />
            <path d="M36 6 L25 14 L36 22" />
          </svg>
        </button>
        <button class="pk-btn flipper-l" id="btn-flip-l" aria-label="左撥桿">
          <svg viewBox="0 0 48 28" aria-hidden="true">
            <g transform="rotate(-14 10 15)">
              <path d="M10 10.5 L38 10.5 Q43 10.5 43 15 Q43 19.5 38 19.5 L10 19.5 Q5 19.5 5 15 Q5 10.5 10 10.5 Z" />
              <circle class="pivot" cx="10" cy="15" r="3" />
            </g>
          </svg>
        </button>
        <button class="pk-btn launch" id="btn-launch" aria-label="發射">
          <svg viewBox="0 0 48 28" aria-hidden="true">
            <path d="M24 2 L37 15 H30 V26 H18 V15 H11 Z" />
          </svg>
          <div id="power-bar"><i></i></div>
        </button>
        <button class="pk-btn flipper-r" id="btn-flip-r" aria-label="右撥桿">
          <svg viewBox="0 0 48 28" aria-hidden="true">
            <g transform="rotate(14 38 15)">
              <path d="M10 10.5 L38 10.5 Q43 10.5 43 15 Q43 19.5 38 19.5 L10 19.5 Q5 19.5 5 15 Q5 10.5 10 10.5 Z" />
              <circle class="pivot" cx="38" cy="15" r="3" />
            </g>
          </svg>
        </button>
        <button class="pk-btn nudge" id="btn-nudge-r" aria-label="推桌右">
          <svg viewBox="0 0 48 28" aria-hidden="true">
            <path d="M26 6 L37 14 L26 22" />
            <path d="M12 6 L23 14 L12 22" />
          </svg>
        </button>
      </footer>
    </div>
  </body>
</html>
